<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Calculator</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background:#1c1c1e;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
      font-family:-apple-system,BlinkMacSystemFont,sans-serif;
    }
    .calculator {
      background:#1c1c1e;
      border-radius:40px;
      padding:24px;
      width:320px;
      box-shadow:0 20px 60px rgba(0,0,0,0.6);
    }
    .display {
      background:#1c1c1e;
      border-radius:16px;
      padding:20px 16px 10px;
      text-align:right;
      margin-bottom:12px;
    }
    .display .expression { font-size:18px; color:#888; min-height:24px; margin-bottom:4px; }
    .display .result { font-size:56px; font-weight:200; color:#fff; letter-spacing:-2px; }
    .buttons { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
    .btn {
      border:none; border-radius:50%;
      width:64px; height:64px;
      font-size:22px; font-weight:400;
      cursor:pointer; transition:opacity 0.1s; outline:none;
    }
    .btn:active  { opacity:0.6; }
    .btn-gray    { background:#a5a5a5; color:#000; }
    .btn-dark    { background:#333335; color:#fff; }
    .btn-orange  { background:#ff9f0a; color:#fff; }
    .btn-zero    {
      width:100%; border-radius:32px;
      text-align:left; padding-left:24px;
      grid-column:span 2;
    }

    /* SOS dot */
    #sos-dot {
      position:fixed; top:14px; right:14px;
      width:8px; height:8px; border-radius:50%;
      background:red; display:none;
      animation:blink 1s infinite; z-index:999;
    }
    @keyframes blink {
      0%,100%{opacity:1;transform:scale(1);}
      50%{opacity:0.3;transform:scale(0.7);}
    }

    /* 10-second cancel overlay */
    #sos-overlay {
      display:none; position:fixed; inset:0;
      background:rgba(0,0,0,0.88);
      justify-content:center; align-items:center;
      flex-direction:column; gap:16px; z-index:1000;
    }
    #sos-overlay h2  { color:#ff3b30; font-size:28px; }
    #sos-overlay p   { color:#fff; font-size:15px; text-align:center; }
    #countdown-text  { color:#ff9f0a; font-size:64px; font-weight:200; }
    #cancel-btn {
      background:#333; color:#fff; border:none;
      padding:12px 32px; border-radius:24px;
      font-size:16px; cursor:pointer; margin-top:8px;
    }
    #pin-input {
      background:#222; border:1px solid #444; color:#fff;
      padding:10px 16px; border-radius:12px;
      font-size:24px; text-align:center;
      width:160px; letter-spacing:8px;
    }

    /* Fake incoming call screen */
    #fake-call {
      display:none; position:fixed; inset:0;
      background:linear-gradient(180deg,#1a1a2e 0%,#16213e 100%);
      flex-direction:column; align-items:center;
      justify-content:space-between;
      padding:60px 40px 80px; z-index:2000;
    }
    .call-status { color:#aaa; font-size:16px; letter-spacing:0.05em; margin-bottom:8px; }
    .call-name   { color:#fff; font-size:36px; font-weight:300; margin-bottom:6px; letter-spacing:-0.5px; }
    .call-info   { color:#888; font-size:14px; }
    .call-avatar {
      width:100px; height:100px; border-radius:50%;
      background:linear-gradient(135deg,#667eea,#764ba2);
      display:flex; align-items:center; justify-content:center;
      font-size:40px; margin:20px auto;
      box-shadow:0 0 0 12px rgba(102,126,234,0.15);
    }
    .call-actions { display:flex; justify-content:space-around; width:100%; }
    .call-btn {
      width:72px; height:72px; border-radius:50%; border:none;
      font-size:28px; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
    }
    .call-decline { background:#ff3b30; }
    .call-accept  { background:#30d158; animation:callpulse 1.5s infinite; }
    @keyframes callpulse {
      0%,100%{ box-shadow:0 0 0 0 rgba(48,209,88,0.4); }
      50%    { box-shadow:0 0 0 20px rgba(48,209,88,0); }
    }

    /* Battery warning */
    #battery-warning {
      display:none; position:fixed; bottom:20px; left:50%;
      transform:translateX(-50%);
      background:#ff9f0a; color:#000;
      padding:10px 20px; border-radius:20px;
      font-size:13px; font-weight:500;
      z-index:3000; white-space:nowrap;
    }

    /* ── BOTTOM NAVBAR ── */
    .navbar {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: #1c1c1e;
      border-top: 1px solid #2c2c2e;
      display: flex; justify-content: space-around; align-items: center;
      padding: 10px 0 18px; z-index: 500;
    }
    .nav-item {
      display: flex; flex-direction: column; align-items: center;
      gap: 4px; text-decoration: none; color: #555;
      font-size: 10px; font-weight: 500;
      min-width: 56px; padding: 4px 0;
      transition: color 0.15s;
    }
    .nav-item.active { color: #ff3b30; }
    .nav-item svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .nav-item.active svg { stroke: #ff3b30; }
    body { padding-bottom: 75px; }
  </style>
</head>
<body>

<!-- Tiny SOS dot -->
<div id="sos-dot"></div>

<!-- Battery warning toast -->
<div id="battery-warning">Battery low — location sent to contacts</div>

<!-- 10-second cancel overlay -->
<div id="sos-overlay">
  <h2>SOS Activating</h2>
  <div id="countdown-text">10</div>
  <p>Enter your cancel PIN to stop</p>
  <input type="password" id="pin-input" maxlength="4"
         placeholder="****" oninput="checkPin(this.value)" autocomplete="off"/>
  <button id="cancel-btn" onclick="cancelSOS()">Cancel SOS</button>
  <p style="color:#666;font-size:13px">If you do nothing, SOS fires automatically</p>
</div>

<!-- Fake incoming call screen -->
<div id="fake-call">
  <div style="text-align:center">
    <div class="call-status">incoming call</div>
    <div class="call-avatar">👩</div>
    <div class="call-name" id="call-contact-name">Mom</div>
    <div class="call-info">mobile</div>
  </div>
  <div style="text-align:center;color:#888;font-size:13px">
    Swipe up to answer
  </div>
  <div class="call-actions">
    <div style="text-align:center">
      <button class="call-btn call-decline" onclick="dismissFakeCall()">&#128245;</button>
      <div style="color:#fff;font-size:12px;margin-top:8px">Decline</div>
    </div>
    <div style="text-align:center">
      <button class="call-btn call-accept" onclick="dismissFakeCall()">&#128222;</button>
      <div style="color:#fff;font-size:12px;margin-top:8px">Accept</div>
    </div>
  </div>
</div>

<!-- Calculator -->
<div class="calculator">
  <div class="display">
    <div class="expression" id="expression"></div>
    <div class="result" id="result">0</div>
  </div>
  <div class="buttons">
    <button class="btn btn-gray"   onclick="clear_all()">AC</button>
    <button class="btn btn-gray"   onclick="toggleSign()">+/-</button>
    <button class="btn btn-gray"   onclick="percent()">%</button>
    <button class="btn btn-orange" onclick="setOp('/')">&#247;</button>

    <button class="btn btn-dark"   onclick="input('7')">7</button>
    <button class="btn btn-dark"   onclick="input('8')">8</button>
    <button class="btn btn-dark"   onclick="input('9')">9</button>
    <button class="btn btn-orange" onclick="setOp('*')">&#215;</button>

    <button class="btn btn-dark"   onclick="input('4')">4</button>
    <button class="btn btn-dark"   onclick="input('5')">5</button>
    <button class="btn btn-dark"   onclick="input('6')">6</button>
    <button class="btn btn-orange" onclick="setOp('-')">&#8722;</button>

    <button class="btn btn-dark"   onclick="input('1')">1</button>
    <button class="btn btn-dark"   onclick="input('2')">2</button>
    <button class="btn btn-dark"   onclick="input('3')">3</button>
    <button class="btn btn-orange" onclick="setOp('+')">+</button>

    <button class="btn btn-dark btn-zero" onclick="input('0')">0</button>
    <button class="btn btn-dark"   onclick="inputDot()">.</button>
    <button class="btn btn-orange" onclick="calculate()">=</button>
  </div>
</div>

<script>
  /* ── PIN from setup screen ── */
  let CANCEL_PIN = "1234";
  try {
    var _cfg = JSON.parse(localStorage.getItem("sheild_config") || "{}");
    CANCEL_PIN = _cfg.pin || localStorage.getItem("sheild_pin") || "1234";
  } catch(e) {}

  /* ── Calculator ── */
  let current="", operator=null, prev="", fresh=false;

  function display(val) {
    document.getElementById("result").textContent = val || "0";
  }
  function input(n) {
    if (fresh) { current=""; fresh=false; }
    current += n; display(current);
  }
  function inputDot() { if (!current.includes(".")) input("."); }
  function setOp(op) {
    if (current==="") return;
    if (prev!=="" && !fresh) calculate();
    operator=op; prev=current;
    document.getElementById("expression").textContent = current+" "+op;
    fresh=true;
  }
  function calculate() {
    if (!operator || prev==="") return;
    let a=parseFloat(prev), b=parseFloat(current), r;
    if (operator==="+") r=a+b;
    if (operator==="-") r=a-b;
    if (operator==="*") r=a*b;
    if (operator==="/") r=b!==0 ? a/b : "Error";
    document.getElementById("expression").textContent = prev+" "+operator+" "+current+" =";
    current = String(parseFloat(r.toFixed(8)));
    operator=null; prev=""; fresh=true; display(current);
  }
  function clear_all() {
    current=""; operator=null; prev=""; fresh=false;
    document.getElementById("expression").textContent="";
    display("0");
  }
  function toggleSign() {
    if (!current) return;
    current = String(parseFloat(current)*-1); display(current);
  }
  function percent() {
    if (!current) return;
    current = String(parseFloat(current)/100); display(current);
  }

  /* ── Hidden SOS trigger — keyboard S x3 ── */
  let sCount=0, sTimer=null;
  document.addEventListener("keydown", function(e) {
    if (e.key==="s" || e.key==="S") {
      sCount++;
      clearTimeout(sTimer);
      if (sCount>=3) { sCount=0; startSOSCountdown(); }
      else { sTimer=setTimeout(()=>{ sCount=0; }, 2000); }
    }
  });

  /* ── Hidden SOS trigger — corner tap x3 ── */
  let tapCount=0, tapTimer=null;
  document.addEventListener("click", function(e) {
    if (e.clientX > window.innerWidth-80 && e.clientY < 80) {
      tapCount++;
      clearTimeout(tapTimer);
      if (tapCount>=3) { tapCount=0; startSOSCountdown(); }
      else { tapTimer=setTimeout(()=>{ tapCount=0; }, 2000); }
    }
  });

  /* ── 10-second countdown ── */
  let countdownTimer=null, seconds=10;
  function startSOSCountdown() {
    seconds=10;
    document.getElementById("sos-dot").style.display     = "block";
    document.getElementById("sos-overlay").style.display = "flex";
    document.getElementById("countdown-text").textContent = seconds;
    document.getElementById("pin-input").value = "";
    countdownTimer = setInterval(()=>{
      seconds--;
      document.getElementById("countdown-text").textContent = seconds;
      if (seconds<=0) { clearInterval(countdownTimer); fireSOS(); }
    }, 1000);
  }
  function cancelSOS() {
    clearInterval(countdownTimer);
    document.getElementById("sos-dot").style.display     = "none";
    document.getElementById("sos-overlay").style.display = "none";
  }
  function checkPin(val) { if (val===CANCEL_PIN) cancelSOS(); }

  /* ── Fake call screen ── */
  function showFakeCall() {
    const config   = JSON.parse(localStorage.getItem("sheild_config") || "{}");
    const contacts = config.contacts || [];
    const name     = contacts.length>0 ? (contacts[0].name || "Mom") : "Mom";
    document.getElementById("call-contact-name").textContent = name;
    document.getElementById("fake-call").style.display = "flex";
  }
  function dismissFakeCall() {
    document.getElementById("fake-call").style.display = "none";
  }

  /* ── Fire SOS ── */
  let mediaRecorder=null, audioChunks=[], recordingStream=null;

  function fireSOS() {
    document.getElementById("sos-overlay").style.display = "none";
    document.getElementById("sos-dot").style.display     = "none";

    /* Show fake call screen — attacker sees normal call */
    showFakeCall();

    /* Send GPS alert immediately */
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        function(pos) {
            sendAlert(pos.coords.latitude, pos.coords.longitude, null);
            sendNativeSMS(pos.coords.latitude, pos.coords.longitude);
          },
        function()    { sendAlert(null, null, null); sendNativeSMS(null, null); },
        { timeout:8000, maximumAge:60000, enableHighAccuracy:true }
      );
    } else { sendAlert(null, null, null); sendNativeSMS(null, null); }

    /* Start silent audio recording in parallel */
    startSilentRecording(function(audioBlob) {
      if (!audioBlob) return;
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          function(pos) { sendAlert(pos.coords.latitude, pos.coords.longitude, audioBlob); },
          function()    { sendAlert(null, null, audioBlob); },
          { timeout:8000, maximumAge:60000, enableHighAccuracy:true }
        );
      } else { sendAlert(null, null, audioBlob); }
    });
  }

  /* ── Silent audio recording ── */
  function startSilentRecording(callback) {
    navigator.mediaDevices.getUserMedia({ audio:true, video:false })
      .then(function(stream) {
        recordingStream=stream; audioChunks=[];
        mediaRecorder = new MediaRecorder(stream);
        mediaRecorder.ondataavailable = function(e) {
          if (e.data.size>0) audioChunks.push(e.data);
        };
        mediaRecorder.onstop = function() {
          const audioBlob = new Blob(audioChunks, { type:"audio/webm" });
          stream.getTracks().forEach(t=>t.stop());
          callback(audioBlob);
        };
        mediaRecorder.start();
        setTimeout(function() {
          if (mediaRecorder && mediaRecorder.state==="recording") mediaRecorder.stop();
        }, 30000);
      })
      .catch(function(err) {
        console.log("Mic unavailable:", err.message);
        callback(null);
      });
  }

  /* ── Send alert to Flask backend ── */
  function sendAlert(lat, lng, audioBlob) {
    fetch("/sos", {
      method  : "POST",
      headers : { "Content-Type":"application/json" },
      body    : JSON.stringify({ lat:lat, lng:lng, time:new Date().toISOString() })
    })
    .then(r=>r.json())
    .then(function(data) {
      if (audioBlob && data.alert_id) {
        const formData = new FormData();
        formData.append("audio",    audioBlob, "evidence.webm");
        formData.append("alert_id", data.alert_id);
        fetch("/upload-audio", { method:"POST", body:formData })
          .then(()=>console.log("Audio uploaded"))
          .catch(()=>console.log("Audio upload failed"));
      }
    })
    .catch(function() {
      /* Offline fallback — queue locally */
      const pending = JSON.parse(localStorage.getItem("pending_sos") || "[]");
      pending.push({ lat:lat, lng:lng, time:new Date().toISOString() });
      localStorage.setItem("pending_sos", JSON.stringify(pending));
    });
  }

  /* ── Battery low auto-alert ── */
  if (navigator.getBattery) {
    navigator.getBattery().then(function(battery) {
      function checkBattery() {
        if (battery.level <= 0.15 && !battery.charging) {
          document.getElementById("battery-warning").style.display = "block";
          setTimeout(()=>{
            document.getElementById("battery-warning").style.display = "none";
          }, 5000);
          if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function(pos) {
              fetch("/battery-low", {
                method  : "POST",
                headers : { "Content-Type":"application/json" },
                body    : JSON.stringify({
                  lat   : pos.coords.latitude,
                  lng   : pos.coords.longitude,
                  level : Math.round(battery.level*100),
                  time  : new Date().toISOString()
                })
              }).catch(()=>{});
            });
          }
        }
      }
      battery.addEventListener("levelchange", checkBattery);
      checkBattery();
    });
  }

  /* ══════════════════════════════════════════════
     NATIVE SMS — FREE, no API needed
     Uses Android/iOS built-in SMS via sms: URL
     Works even without internet
  ══════════════════════════════════════════════ */
  function sendNativeSMS(lat, lng) {
    var phones = [];
    try {
      var cfg = JSON.parse(localStorage.getItem("sheild_config") || "{}");
      if (cfg.contacts) {
        phones = cfg.contacts
          .filter(function(c) { return c.phone && c.phone.trim(); })
          .map(function(c) { return c.phone.trim().replace(/\D/g,"").slice(-10); });
      }
    } catch(e) {}
    if (phones.length === 0) { console.log("Native SMS: no phones in config"); return; }

    var msg = lat
      ? ("SOS EMERGENCY! I need help NOW!\nLocation: https://maps.google.com/?q="+lat+","+lng+"\nPlease come or call police!")
      : ("SOS EMERGENCY! I need help NOW!\nGPS unavailable - call me immediately!");

    var encoded = encodeURIComponent(msg);
    var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
    phones.forEach(function(phone, i) {
      setTimeout(function() {
        var url = isIOS ? ("sms:"+phone+"&body="+encoded) : ("sms:"+phone+"?body="+encoded);
        var a = document.createElement("a");
        a.href = url; a.style.display = "none";
        document.body.appendChild(a); a.click();
        setTimeout(function(){ document.body.removeChild(a); }, 1000);
        console.log("Native SMS -> "+phone);
      }, i * 2000);
    });
  }

  /* ══ OFFLINE RETRY — resends queued SOS when back online ══ */
  window.addEventListener("online", function() {
    var pending = JSON.parse(localStorage.getItem("pending_sos") || "[]");
    if (!pending.length) return;
    console.log("Back online — retrying "+pending.length+" queued SOS alerts");
    pending.forEach(function(item) {
      fetch("/sos", {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({lat:item.lat, lng:item.lng, time:item.time})
      }).then(function(){ console.log("Queued SOS sent"); })
        .catch(function(){ console.log("Queued SOS still failed"); });
    });
    localStorage.removeItem("pending_sos");
  });
</script>

</body>
