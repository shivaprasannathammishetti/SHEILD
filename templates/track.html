<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SHEild — Live Tracking</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      background: #0f0f10;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #2c2c2e;
      background: #0f0f10;
      flex-shrink: 0;
      z-index: 10;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .live-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ff3b30;
      animation: pulse 1s infinite;
      flex-shrink: 0;
    }

    @keyframes pulse {
      0%,100% { opacity: 1; transform: scale(1); }
      50%      { opacity: 0.3; transform: scale(0.8); }
    }

    .header-title { font-size: 16px; font-weight: 500; }
    .header-sub   { font-size: 12px; color: #666; margin-top: 2px; }

    .update-badge {
      background: #1c1c1e;
      border: 1px solid #2c2c2e;
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 12px;
      color: #888;
    }

    #map { flex: 1; width: 100%; }

    .info-bar {
      background: #1c1c1e;
      border-top: 1px solid #2c2c2e;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .coords {
      font-size: 13px;
      color: #888;
      font-family: monospace;
    }

    .maps-link {
      background: #ff3b30;
      color: #fff;
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 13px;
      text-decoration: none;
      font-weight: 500;
    }

    .maps-link:hover { background: #e0332a; }

    .no-data {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: #555;
    }

    .no-data-icon { font-size: 48px; }
    .no-data-text { font-size: 15px; }
    .no-data-sub  { font-size: 13px; color: #444; }

    .spinner-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(15,15,16,0.7);
      z-index: 5;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #2c2c2e;
      border-top-color: #ff3b30;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  
    /* ── BOTTOM NAVBAR ── */
    .navbar {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: #1c1c1e; border-top: 1px solid #2c2c2e;
      display: flex; justify-content: space-around; align-items: center;
      padding: 8px 0 12px; z-index: 500;
    }
    .nav-item {
      display: flex; flex-direction: column; align-items: center;
      gap: 3px; text-decoration: none; color: #666;
      font-size: 10px; font-weight: 500; padding: 4px 12px;
      border-radius: 10px; transition: color 0.15s;
    }
    .nav-item.active { color: #ff3b30; }
    .nav-item:hover  { color: #fff; }
    .nav-icon { font-size: 20px; }
    body { padding-bottom: 70px; }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="live-dot"></div>
    <div>
      <div class="header-title">SHEild — Live Location</div>
      <div class="header-sub" id="last-update">Connecting...</div>
    </div>
  </div>
  <div class="update-badge">↻ every 10s</div>
</div>

<div id="map-wrapper" style="flex:1;position:relative;display:flex;flex-direction:column;">
  <div class="spinner-overlay" id="spinner-overlay">
    <div class="spinner"></div>
  </div>
  <div id="map" style="flex:1;width:100%;display:none;"></div>
  <div class="no-data" id="no-data" style="display:none;">
    <div class="no-data-icon">📡</div>
    <div class="no-data-text">Waiting for GPS signal...</div>
    <div class="no-data-sub">Will update automatically when location arrives</div>
  </div>
</div>

<div class="info-bar" id="info-bar" style="display:none;">
  <div class="coords" id="coords-text">—</div>
  <a href="#" class="maps-link" id="maps-open" target="_blank">Open in Maps</a>
</div>

<script>
  const alertId = "{{ alert_id }}";
  let map, marker, circle;
  let mapInitialized = false;

  function initMap() {
    map = new google.maps.Map(document.getElementById('map'), {
      zoom: 16,
      center: { lat: 17.385044, lng: 78.486671 }, // default Hyderabad
      styles: [
        { elementType: 'geometry',           stylers: [{ color: '#1a1a2e' }] },
        { elementType: 'labels.text.fill',   stylers: [{ color: '#746855' }] },
        { elementType: 'labels.text.stroke', stylers: [{ color: '#1a1a2e' }] },
        { featureType: 'road', elementType: 'geometry',         stylers: [{ color: '#2a2a3e' }] },
        { featureType: 'road', elementType: 'labels.text.fill', stylers: [{ color: '#9ca5b3' }] },
        { featureType: 'water', stylers: [{ color: '#0d1b2a' }] },
        { featureType: 'poi',   stylers: [{ visibility: 'off' }] }
      ]
    });
    mapInitialized = true;
    fetchLocation();
    setInterval(fetchLocation, 10000);
  }

  function fetchLocation() {
    fetch('/track-data/' + alertId)
      .then(r => r.json())
      .then(data => {
        document.getElementById('spinner-overlay').style.display = 'none';

        if (!data || !data.lat) {
          document.getElementById('map').style.display    = 'none';
          document.getElementById('no-data').style.display = 'flex';
          document.getElementById('info-bar').style.display = 'none';
          document.getElementById('last-update').textContent = 'No GPS yet — retrying...';
          return;
        }

        const pos = { lat: data.lat, lng: data.lng };

        // Show map, hide no-data
        document.getElementById('map').style.display    = 'block';
        document.getElementById('no-data').style.display = 'none';
        document.getElementById('info-bar').style.display = 'flex';

        map.setCenter(pos);

        if (!marker) {
          marker = new google.maps.Marker({
            position: pos,
            map,
            title: 'SOS Location',
            icon: {
              path: google.maps.SymbolPath.CIRCLE,
              scale: 14,
              fillColor: '#ff3b30',
              fillOpacity: 1,
              strokeColor: '#fff',
              strokeWeight: 3
            }
          });
          circle = new google.maps.Circle({
            strokeColor: '#ff3b30', strokeOpacity: 0.3, strokeWeight: 1,
            fillColor: '#ff3b30',   fillOpacity: 0.08,
            map, center: pos, radius: 120
          });
        } else {
          marker.setPosition(pos);
          circle.setCenter(pos);
        }

        // Update info bar
        document.getElementById('coords-text').textContent =
          data.lat.toFixed(5) + ', ' + data.lng.toFixed(5);
        document.getElementById('maps-open').href =
          'https://maps.google.com/?q=' + data.lat + ',' + data.lng;

        const now = new Date();
        document.getElementById('last-update').textContent =
          'Updated ' + now.toLocaleTimeString();
      })
      .catch(() => {
        document.getElementById('spinner-overlay').style.display = 'none';
        document.getElementById('last-update').textContent = 'Connection error — retrying...';
      });
  }

  // Kick off fetch immediately without waiting for maps (shows no-data or spinner)
  fetchLocation();
</script>
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAP7__5xM64YmapiegQM6On7-rolHXr2Uo&callback=initMap" async defer></script>


<nav class="navbar">
  <a href="/" class="nav-item">
    <span class="nav-icon">🔢</span>
    <span>App</span>
  </a>
  <a href="/saferoute" class="nav-item">
    <span class="nav-icon">🗺</span>
    <span>Safe Route</span>
  </a>
  <a href="/dashboard" class="nav-item">
    <span class="nav-icon">📊</span>
    <span>Dashboard</span>
  </a>
  <a href="/history" class="nav-item">
    <span class="nav-icon">📋</span>
    <span>History</span>
  </a>
  <a href="/setup" class="nav-item">
    <span class="nav-icon">⚙️</span>
    <span>Setup</span>
  </a>
</nav>
</body>
</html>
